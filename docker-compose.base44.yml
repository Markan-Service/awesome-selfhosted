services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    command: >
      sh -ec '
        pip install --no-cache-dir --quiet markdown &&
        exec python serve.py
      '
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/')\""]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
